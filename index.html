<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b6b3a" />
<title>FreeBuff Projects</title>
<style>
  :root {
    --panel-green: #0b6b3a;
    --panel-green-dark: #085229;
    --panel-green-darker: #06411f;
    --panel-yellow: #ffe14d;
    --panel-yellow-dim: #f2cf3a;
    --page-bg: #eef2ee;
    --ink: #1d2a22;
    --ink-soft: #55665c;
    --card-bg: #ffffff;
    --ring: 0 0 0 3px rgba(255, 225, 77, 0.45);
    --radius: 12px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 18px;
    padding-top: max(18px, env(safe-area-inset-top));
    padding-bottom: max(18px, env(safe-area-inset-bottom));
    padding-left: max(18px, env(safe-area-inset-left));
    padding-right: max(18px, env(safe-area-inset-right));
    /* dvh keeps the layout correct when mobile browser bars show/hide. */
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--page-bg);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top panel: project menus ---------- */

  .projects-panel {
    background: var(--panel-green);
    color: var(--panel-yellow);
    border-radius: var(--radius);
    border: 1px solid var(--panel-green-darker);
    box-shadow: 0 6px 18px rgba(6, 65, 31, 0.22);
    overflow: visible;
  }

  .projects-panel__head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
  }

  .projects-panel__title {
    grid-column: 2;
    margin: 0;
    text-align: center;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--panel-yellow);
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
  }

  .toggle-btn {
    grid-column: 3;
    justify-self: end;
    margin-left: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 8px 14px;
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--panel-green-darker);
    background: var(--panel-yellow);
    border: 1px solid var(--panel-yellow-dim);
    border-radius: 999px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s ease, filter 0.12s ease;
  }

  .toggle-btn:hover { filter: brightness(1.06); }
  .toggle-btn:active { transform: translateY(1px); }
  .toggle-btn:focus-visible { outline: none; box-shadow: var(--ring); }

  .toggle-btn__chevron {
    display: inline-block;
    font-size: 0.8em;
    transition: transform 0.2s ease;
  }

  .projects-panel.is-collapsed .toggle-btn__chevron { transform: rotate(-90deg); }

  .projects-panel__body {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 0 16px 16px;
    text-align: center;
  }

  .projects-panel.is-collapsed .projects-panel__body { display: none; }

  /* ---------- Dropdown menus ---------- */

  .menu {
    position: relative;
  }

  .menu__btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 10px 16px;
    -webkit-tap-highlight-color: transparent;
    font: inherit;
    font-weight: 600;
    color: var(--panel-yellow);
    background: var(--panel-green-dark);
    border: 1px solid rgba(255, 225, 77, 0.55);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .menu__btn:hover { background: var(--panel-green-darker); border-color: var(--panel-yellow); }
  .menu__btn:focus-visible { outline: none; box-shadow: var(--ring); }
  .menu__btn[aria-expanded="true"] { background: var(--panel-green-darker); border-color: var(--panel-yellow); }

  .menu__caret { font-size: 0.7em; transition: transform 0.18s ease; }
  .menu__btn[aria-expanded="true"] .menu__caret { transform: rotate(180deg); }

  .menu__list {
    position: absolute;
    z-index: 20;
    top: calc(100% + 8px);
    left: 0;
    min-width: 260px;
    max-width: min(360px, 88vw);
    margin: 0;
    padding: 6px;
    list-style: none;
    background: #ffffff;
    color: var(--ink);
    border: 1px solid #cdd8cf;
    border-radius: 10px;
    box-shadow: 0 12px 28px rgba(6, 65, 31, 0.28);
  }

  .menu__list[hidden] { display: none; }

  .menu__item {
    display: block;
    width: 100%;
    min-height: 40px;
    padding: 10px;
    -webkit-tap-highlight-color: transparent;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
  }

  .menu__item:hover,
  .menu__item:focus-visible {
    background: #eaf5ec;
    outline: none;
  }

  .menu__item-title { display: block; font-weight: 600; }

  .menu__item-url {
    display: block;
    margin-top: 2px;
    font-size: 0.78rem;
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }

  /* ---------- Bottom panel: links ---------- */

  .links-panel {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 420px;
    padding: 16px;
    background: var(--card-bg);
    border: 1px solid #d8e0d9;
    border-radius: var(--radius);
    box-shadow: 0 4px 14px rgba(20, 40, 28, 0.07);
  }

  .links-panel__head {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid #e4eae5;
  }

  .links-panel__title {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--panel-green);
  }

  .viewer__meta {
    flex: 1 1 280px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    min-width: 0;
  }

  .viewer__meta[hidden] { display: none; }

  .viewer__category {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--panel-green);
  }

  .viewer__title {
    font-weight: 600;
    color: var(--ink);
    overflow-wrap: anywhere;
  }

  .viewer__url {
    width: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }

  .viewer__open {
    margin-left: auto;
    min-height: 40px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    color: var(--panel-green-darker);
    background: var(--panel-yellow);
    border: 1px solid var(--panel-yellow-dim);
    border-radius: 8px;
    white-space: nowrap;
  }

  .viewer__open:hover { filter: brightness(1.05); }
  .viewer__open[hidden] { display: none; }

  .hint {
    margin: 24px 4px;
    color: var(--ink-soft);
    text-align: center;
  }

  .hint[hidden] { display: none; }

  .viewer {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
    min-height: 0;
  }

  .viewer[hidden] { display: none; }

  .viewer iframe {
    flex: 1 1 auto;
    width: 100%;
    min-height: 340px;
    border: 1px solid #dfe7e1;
    border-radius: 10px;
    background: #ffffff;
  }

  .viewer__notice {
    margin: 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  .viewer__notice strong { color: var(--ink); }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- Responsive: tablets and small windows ---------- */
  @media (max-width: 820px) {
    .projects-panel__title { font-size: 1.2rem; }
    /* Two menus per row rather than four cramped ones. */
    .menu { flex: 1 1 calc(50% - 10px); }
    .menu__btn { width: 100%; justify-content: space-between; }
    /* Pin the dropdown inside its column so it can never overflow the screen. */
    .menu__list {
      left: 0;
      right: 0;
      width: auto;
      min-width: 0;
      max-width: none;
    }
    /* Let the viewer size to its content instead of forcing page scroll. */
    .links-panel { min-height: 0; }
  }

  /* ---------- Responsive: phones ---------- */
  @media (max-width: 560px) {
    body {
      gap: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
    }

    .projects-panel__head {
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 12px;
    }
    .projects-panel__title { grid-column: 1; font-size: 1.15rem; }
    .toggle-btn { grid-column: 1; justify-self: center; margin-left: 0; }

    /* One full-width menu per row, stacked. */
    .projects-panel__body {
      flex-direction: column;
      gap: 8px;
      padding: 0 12px 12px;
    }
    .menu { flex: 1 1 auto; }
    .menu__btn { width: 100%; min-height: 48px; justify-content: space-between; }
    .menu__item { min-height: 44px; padding: 12px 10px; }

    .links-panel { padding: 12px; }
    .links-panel__head { gap: 8px; }
    .viewer__meta { flex: 1 1 100%; }
    /* Full-width button: an easy thumb target. */
    .viewer__open {
      margin-left: 0;
      flex: 1 1 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
    }
    .hint { margin: 16px 4px; }
    .viewer iframe {
      min-height: 55vh;
      min-height: 55dvh;
    }
    .viewer__notice { font-size: 0.82rem; }
  }

  /* ---------- Responsive: very small phones ---------- */
  @media (max-width: 380px) {
    .projects-panel__title { font-size: 1.05rem; }
    .menu__btn { padding: 10px 12px; font-size: 0.95rem; }
    .viewer iframe {
      min-height: 45vh;
      min-height: 45dvh;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<!-- ===================== TOP PANEL ===================== -->
<section class="projects-panel" id="projectsPanel" aria-labelledby="projectsTitle">
  <div class="projects-panel__head">
    <h1 class="projects-panel__title" id="projectsTitle">FreeBuff Projects</h1>
    <button
      type="button"
      class="toggle-btn"
      id="panelToggle"
      aria-expanded="true"
      aria-controls="projectsBody"
    >
      <span class="toggle-btn__chevron" aria-hidden="true">▾</span>
      <span class="toggle-btn__label">Collapse</span>
    </button>
  </div>

  <div class="projects-panel__body" id="projectsBody">
    <!-- Dropdown menus are generated from the PROJECT_MENUS data below. -->
  </div>
</section>

<!-- ===================== BOTTOM PANEL ===================== -->
<section class="links-panel" aria-labelledby="linksTitle">
  <div class="links-panel__head">
    <h2 class="links-panel__title" id="linksTitle">Link Viewer</h2>
    <div class="viewer__meta" id="viewerMeta" hidden>
      <span class="viewer__category" id="viewerCategory"></span>
      <span class="viewer__title" id="viewerTitle"></span>
      <span class="viewer__url" id="viewerUrl"></span>
    </div>
    <a class="viewer__open" id="viewerOpen" target="_blank" rel="noopener noreferrer" hidden>Open in new tab ↗</a>
  </div>

  <p class="hint" id="linksHint">
    Choose a menu above to open its URL in this panel.
  </p>

  <div class="viewer" id="viewer" hidden>
    <iframe id="viewerFrame" title="Selected project link" referrerpolicy="no-referrer"></iframe>
    <p class="viewer__notice">
      <strong>Panel blank or blocked?</strong> Many sites refuse to load inside another page
      (or are served over plain http). Use <strong>Open in new tab</strong> for those.
    </p>
  </div>
</section>

<p class="visually-hidden" id="liveRegion" role="status" aria-live="polite"></p>

<script>
  /* ------------------------------------------------------------------
     Edit this data to change the menus and the links they contain.
     Each menu: { label, links: [{ title, url }] }
  ------------------------------------------------------------------ */
  const PROJECT_MENUS = [
    {
      label: "Chemistry",
      links: [
        { title: "PubChem Periodic Table", url: "https://pubchem.ncbi.nlm.nih.gov/periodic-table/" },
        { title: "PubChem Compound Search", url: "https://pubchem.ncbi.nlm.nih.gov/" },
        { title: "Royal Society of Chemistry", url: "https://www.rsc.org/" }
      ]
    },
    {
      label: "Chemistry Lab",
      links: [
        { title: "ChemCollective Virtual Labs", url: "https://chemcollective.org/vlabs" },
        { title: "PhET Chemistry Simulations", url: "https://phet.colorado.edu/en/simulations/filter?subjects=chemistry" },
        { title: "MolView Structure Builder", url: "https://molview.org/" }
      ]
    },
    {
      label: "Physics",
      links: [
        { title: "HyperPhysics", url: "http://hyperphysics.phy-astr.gsu.edu/hbase/hframe.html" },
        { title: "PhET Physics Simulations", url: "https://phet.colorado.edu/en/simulations/filter?subjects=physics" },
        { title: "The Physics Classroom", url: "https://www.physicsclassroom.com/" }
      ]
    },
    {
      label: "Physics Lab",
      links: [
        { title: "oPhysics Simulations", url: "https://ophysics.com/" },
        { title: "Tracker Video Analysis", url: "https://physlets.org/tracker/" },
        { title: "PhET Motion & Forces Labs", url: "https://phet.colorado.edu/en/simulations/filter?subjects=motion" }
      ]
    }
  ];

  const projectsPanel = document.getElementById("projectsPanel");
  const panelBody = document.getElementById("projectsBody");
  const panelToggle = document.getElementById("panelToggle");
  const toggleLabel = panelToggle.querySelector(".toggle-btn__label");
  const linksHint = document.getElementById("linksHint");
  const liveRegion = document.getElementById("liveRegion");
  const viewer = document.getElementById("viewer");
  const viewerMeta = document.getElementById("viewerMeta");
  const viewerCategory = document.getElementById("viewerCategory");
  const viewerTitle = document.getElementById("viewerTitle");
  const viewerUrl = document.getElementById("viewerUrl");
  const viewerOpen = document.getElementById("viewerOpen");
  const viewerFrame = document.getElementById("viewerFrame");

  /* ---------- Build the dropdown menus ---------- */
  const menuButtons = [];

  PROJECT_MENUS.forEach((menu, index) => {
    const wrapper = document.createElement("div");
    wrapper.className = "menu";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "menu__btn";
    btn.id = `menuBtn-${index}`;
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-haspopup", "true");
    btn.setAttribute("aria-controls", `menuList-${index}`);
    btn.innerHTML = `<span>${menu.label}</span><span class="menu__caret" aria-hidden="true">▾</span>`;

    const list = document.createElement("ul");
    list.className = "menu__list";
    list.id = `menuList-${index}`;
    list.setAttribute("aria-labelledby", btn.id);
    list.hidden = true;

    menu.links.forEach((link) => {
      const item = document.createElement("li");
      const action = document.createElement("button");
      action.type = "button";
      action.className = "menu__item";
      action.innerHTML =
        `<span class="menu__item-title"></span><span class="menu__item-url"></span>`;
      action.querySelector(".menu__item-title").textContent = link.title;
      action.querySelector(".menu__item-url").textContent = link.url;
      action.addEventListener("click", () => {
        openInPanel(menu.label, link.title, link.url);
        closeAllMenus();
        btn.focus();
      });
      item.appendChild(action);
      list.appendChild(item);
    });

    btn.addEventListener("click", (event) => {
      event.stopPropagation();
      const isOpen = btn.getAttribute("aria-expanded") === "true";
      closeAllMenus();
      if (!isOpen) openMenu(btn, list);
    });

    // Keyboard: open with ArrowDown, close with Escape, arrow through items.
    btn.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown" || event.key === "Enter" || event.key === " ") {
        if (btn.getAttribute("aria-expanded") !== "true") {
          event.preventDefault();
          closeAllMenus();
          openMenu(btn, list);
          list.querySelector(".menu__item")?.focus();
        }
      }
    });

    list.addEventListener("keydown", (event) => {
      const items = Array.from(list.querySelectorAll(".menu__item"));
      const current = items.indexOf(document.activeElement);
      if (event.key === "ArrowDown") {
        event.preventDefault();
        items[(current + 1) % items.length]?.focus();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        items[(current - 1 + items.length) % items.length]?.focus();
      } else if (event.key === "Escape") {
        event.preventDefault();
        closeAllMenus();
        btn.focus();
      } else if (event.key === "Tab") {
        closeAllMenus();
      }
    });

    wrapper.append(btn, list);
    panelBody.appendChild(wrapper);
    menuButtons.push({ btn, list });
  });

  function openMenu(btn, list) {
    btn.setAttribute("aria-expanded", "true");
    list.hidden = false;
  }

  function closeAllMenus() {
    menuButtons.forEach(({ btn, list }) => {
      btn.setAttribute("aria-expanded", "false");
      list.hidden = true;
    });
  }

  document.addEventListener("click", (event) => {
    if (!event.target.closest(".menu")) closeAllMenus();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeAllMenus();
  });

  /* ---------- Collapse / expand the top panel ---------- */
  panelToggle.addEventListener("click", () => {
    const collapsed = projectsPanel.classList.toggle("is-collapsed");
    panelToggle.setAttribute("aria-expanded", String(!collapsed));
    toggleLabel.textContent = collapsed ? "Expand" : "Collapse";
    panelBody.inert = collapsed;
    if (collapsed) closeAllMenus();
    projectsPanel.querySelector(".toggle-btn__chevron").setAttribute(
      "aria-label",
      collapsed ? "Panel collapsed" : "Panel expanded"
    );
  });

  /* ---------- Open the selected URL in the bottom panel ---------- */
  function openInPanel(category, title, url) {
    viewer.hidden = false;
    linksHint.hidden = true;
    viewerMeta.hidden = false;

    viewerCategory.textContent = category;
    viewerTitle.textContent = title;
    viewerUrl.textContent = url;

    viewerOpen.hidden = false;
    viewerOpen.href = url;
    viewerOpen.setAttribute("aria-label", `Open ${title} in a new tab`);

    viewerFrame.title = `${title} — ${category}`;
    viewerFrame.src = url;

    liveRegion.textContent = `Opened ${title} in the link panel.`;
  }
</script>
</body>
</html>
